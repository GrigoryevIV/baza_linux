<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=basis.html">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Основы GNU/Linux - Перенаправление...</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .loader {
      text-align: center;
    }

    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
  <script>
    // Fallback redirect if meta refresh doesn't work
    window.location.href = "basis.html";
  </script>
</head>

<body>
  <div class="loader">
    <div class="spinner"></div>
    <h2>Перенаправление на главную страницу...</h2>
    <p>Если перенаправление не произошло, <a href="basis.html" style="color: #fff; text-decoration: underline;">нажмите
        здесь</a>.</p>
  </div>
</body>

</html>
